<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Interview Debrief Agent</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=DM+Mono:wght@400;500&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f8f7f5;
    --surface: #ffffff;
    --surface2: #f2f1ef;
    --border: #e4e3e0;
    --border-dark: #c8c7c3;
    --text: #1a1917;
    --text-mid: #5a5855;
    --text-muted: #9a9895;
    --text-dim: #c4c3c0;
    --ink: #1a1917;
    --mono: 'DM Mono', monospace;
    --sans: 'Inter', sans-serif;
    --radius: 8px;
    --radius-sm: 5px;
  }

  body {
    font-family: var(--sans);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.6;
    font-size: 14px;
    font-weight: 400;
  }

  /* ── Lock screen ── */
  #lock-screen {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    background: var(--bg);
  }
  .lock-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 40px 44px;
    width: 340px;
  }
  .lock-mark {
    font-family: var(--mono);
    font-size: 9px;
    color: var(--text-muted);
    letter-spacing: 0.18em;
    text-transform: uppercase;
    margin-bottom: 4px;
  }
  .lock-title {
    font-size: 15px;
    font-weight: 500;
    color: var(--text);
    letter-spacing: -0.01em;
    margin-bottom: 28px;
  }
  .lock-label {
    font-size: 11px;
    font-weight: 500;
    color: var(--text-muted);
    letter-spacing: 0.01em;
    display: block;
    margin-bottom: 6px;
  }
  .lock-input {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text);
    font-family: var(--sans);
    font-size: 13px;
    padding: 10px 12px;
    outline: none;
    transition: border-color 0.15s;
    margin-bottom: 14px;
    letter-spacing: 0.08em;
  }
  .lock-input:focus { border-color: var(--border-dark); background: var(--surface); }
  .lock-btn {
    width: 100%;
    padding: 10px;
    background: var(--ink);
    border: none;
    border-radius: var(--radius-sm);
    color: #fff;
    font-family: var(--sans);
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: opacity 0.15s;
    letter-spacing: 0.01em;
  }
  .lock-btn:hover { opacity: 0.82; }
  .lock-error {
    font-size: 11px;
    color: var(--text-mid);
    margin-top: 10px;
    text-align: center;
    min-height: 16px;
  }

  /* ── App ── */
  #app { display: none; }
  .app-inner { display: grid; grid-template-columns: 240px 1fr; min-height: 100vh; }

  .sidebar {
    background: var(--surface);
    border-right: 1px solid var(--border);
    padding: 32px 0;
    display: flex;
    flex-direction: column;
    position: sticky;
    top: 0;
    height: 100vh;
    overflow-y: auto;
  }
  .logo { padding: 0 24px 28px; border-bottom: 1px solid var(--border); margin-bottom: 20px; }
  .logo-mark { font-family: var(--mono); font-size: 9px; color: var(--text-muted); letter-spacing: 0.18em; text-transform: uppercase; margin-bottom: 5px; }
  .logo-name { font-size: 13px; font-weight: 500; color: var(--text); letter-spacing: -0.01em; }

  .sidebar-section { padding: 0 16px; margin-bottom: 8px; }
  .sidebar-label { font-size: 9px; font-weight: 500; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.14em; padding: 0 8px; margin-bottom: 6px; }

  .new-btn {
    display: flex; align-items: center; gap: 8px;
    width: 100%; padding: 9px 12px;
    background: var(--ink); border: none; border-radius: var(--radius-sm);
    color: #fff; font-family: var(--sans); font-size: 12px; font-weight: 500;
    cursor: pointer; transition: opacity 0.15s; margin-bottom: 20px; letter-spacing: 0.01em;
  }
  .new-btn:hover { opacity: 0.82; }
  .plus { font-size: 16px; line-height: 1; font-weight: 300; }

  .session-item {
    display: flex; flex-direction: column;
    padding: 9px 12px; border-radius: var(--radius-sm);
    cursor: pointer; transition: background 0.1s;
    border: 1px solid transparent; margin-bottom: 2px;
  }
  .session-item:hover { background: var(--surface2); }
  .session-item.active { background: var(--surface2); border-color: var(--border); }
  .session-company { font-size: 12px; font-weight: 500; color: var(--text); }
  .session-meta { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
  .session-score { font-family: var(--mono); font-size: 10px; color: var(--text-mid); margin-top: 3px; }
  .sidebar-empty { padding: 8px 12px; font-size: 12px; color: var(--text-dim); }

  .signout-btn {
    margin: auto 16px 0;
    padding: 8px 12px;
    background: none;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text-muted);
    font-family: var(--sans);
    font-size: 11px;
    cursor: pointer;
    transition: all 0.15s;
    text-align: left;
  }
  .signout-btn:hover { border-color: var(--border-dark); color: var(--text-mid); }

  .main { padding: 48px 56px; max-width: 820px; }

  .panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 28px 32px; margin-bottom: 20px; }
  .panel-title { font-size: 9px; font-weight: 500; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.14em; margin-bottom: 20px; }

  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 14px; }
  .form-group { display: flex; flex-direction: column; gap: 5px; }
  .form-group.full { grid-column: 1 / -1; }
  label { font-size: 11px; font-weight: 500; color: var(--text-muted); letter-spacing: 0.01em; }

  input, textarea, select {
    background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius-sm);
    color: var(--text); font-family: var(--sans); font-size: 13px; padding: 9px 11px;
    transition: border-color 0.15s; outline: none; width: 100%; font-weight: 400;
  }
  input:focus, textarea:focus, select:focus { border-color: var(--border-dark); background: var(--surface); }
  textarea { resize: vertical; line-height: 1.65; }
  ::placeholder { color: var(--text-dim); }
  select option { background: var(--surface); }
  .char-hint { font-size: 11px; color: var(--text-dim); margin-top: 4px; }

  .run-btn {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    width: 100%; padding: 12px; background: var(--ink); border: none;
    border-radius: var(--radius-sm); color: #fff; font-family: var(--sans);
    font-size: 13px; font-weight: 500; cursor: pointer; transition: opacity 0.15s;
    margin-top: 20px; letter-spacing: 0.01em;
  }
  .run-btn:hover { opacity: 0.82; }
  .run-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  .spinner { width: 14px; height: 14px; border: 1.5px solid rgba(255,255,255,0.3); border-top-color: #fff; border-radius: 50%; animation: spin 0.7s linear infinite; display: none; }
  .run-btn.loading .spinner { display: block; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .page-header { margin-bottom: 28px; }
  .page-eyebrow { font-family: var(--mono); font-size: 10px; color: var(--text-muted); letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 8px; }
  .page-title { font-size: 22px; font-weight: 500; margin-bottom: 4px; letter-spacing: -0.02em; }
  .page-sub { font-size: 12px; color: var(--text-muted); }

  .score-badge { font-family: var(--mono); font-size: 12px; font-weight: 500; padding: 4px 10px; border-radius: 20px; border: 1px solid var(--border-dark); color: var(--text-mid); background: var(--surface); }

  .insight-box { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px 22px; margin-bottom: 14px; }
  .insight-label { font-size: 9px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.14em; color: var(--text-muted); margin-bottom: 7px; }
  .insight-text { font-size: 13px; color: var(--text); line-height: 1.7; }
  .insight-box.fix { border-left: 2px solid var(--ink); border-radius: 0 var(--radius) var(--radius) 0; }

  .qa-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 10px; overflow: hidden; }
  .qa-card.weak { border-left: 2px solid var(--ink); border-radius: 0 var(--radius) var(--radius) 0; }
  .qa-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; padding: 14px 20px; cursor: pointer; user-select: none; }
  .qa-header:hover { background: var(--surface2); }
  .qa-question { font-size: 13px; font-weight: 500; color: var(--text); flex: 1; line-height: 1.5; }
  .qa-score-row { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
  .qa-num { font-family: var(--mono); font-size: 15px; font-weight: 500; color: var(--text-mid); line-height: 1; min-width: 18px; text-align: right; }
  .qa-num.low { color: var(--text); }
  .qa-chevron { color: var(--text-dim); transition: transform 0.2s; font-size: 11px; }
  .qa-card.open .qa-chevron { transform: rotate(180deg); }
  .qa-body { display: none; border-top: 1px solid var(--border); }
  .qa-card.open .qa-body { display: block; }
  .qa-section { padding: 14px 20px; border-bottom: 1px solid var(--border); }
  .qa-section:last-child { border-bottom: none; }
  .qa-section-label { font-size: 9px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.14em; color: var(--text-muted); margin-bottom: 7px; }
  .qa-text { font-size: 13px; color: var(--text-mid); line-height: 1.7; white-space: pre-wrap; }
  .qa-rationale { font-size: 11px; color: var(--text-dim); margin-top: 5px; line-height: 1.6; }
  .qa-rewrite { font-size: 13px; color: var(--text); line-height: 1.7; white-space: pre-wrap; background: var(--bg); padding: 12px 14px; border-radius: var(--radius-sm); border: 1px solid var(--border); }

  .divider { border: none; border-top: 1px solid var(--border); margin: 24px 0; }
  .error-box { background: var(--surface2); border: 1px solid var(--border-dark); border-radius: var(--radius); padding: 14px 18px; font-size: 12px; color: var(--text-mid); margin-bottom: 16px; }

  @media (max-width: 700px) {
    .app-inner { grid-template-columns: 1fr; }
    .sidebar { position: static; height: auto; }
    .main { padding: 28px 20px; }
    .form-row { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<!-- Lock screen -->
<div id="lock-screen">
  <div class="lock-card">
    <div class="lock-mark">debrief</div>
    <div class="lock-title">Interview Agent</div>
    <label class="lock-label" for="pw-input">Password</label>
    <input class="lock-input" id="pw-input" type="password" placeholder="········" onkeydown="if(event.key==='Enter')unlock()" autocomplete="current-password" />
    <button class="lock-btn" onclick="unlock()">Enter</button>
    <div class="lock-error" id="lock-error"></div>
  </div>
</div>

<!-- App -->
<div id="app">
  <div class="app-inner">
    <aside class="sidebar">
      <div class="logo">
        <div class="logo-mark">debrief</div>
        <div class="logo-name">Interview Agent</div>
      </div>
      <div class="sidebar-section">
        <button class="new-btn" onclick="showNew()"><span class="plus">+</span> New debrief</button>
      </div>
      <div class="sidebar-section">
        <div class="sidebar-label">Sessions</div>
        <div id="session-list"></div>
      </div>
      <button class="signout-btn" onclick="signOut()">Sign out</button>
    </aside>
    <main class="main" id="main-panel"></main>
  </div>
</div>

<script>
// ── Auth ──────────────────────────────────────────────────────
// Password is hashed so it's not readable in source.
// To change it: run btoa(yourPassword) in console and update HASH below.
// Current password is set during first setup via prompt below.
const HASH_KEY  = 'debrief_pw_hash';
const SESSION_KEY = 'debrief_authed';

function hashString(str) {
  // Simple deterministic hash — not cryptographic, but obscures plaintext in source
  let h = 0;
  for (let i = 0; i < str.length; i++) {
    h = Math.imul(31, h) + str.charCodeAt(i) | 0;
  }
  return h.toString(36);
}

function getStoredHash() {
  return localStorage.getItem(HASH_KEY);
}

function setPassword(pw) {
  localStorage.setItem(HASH_KEY, hashString(pw));
}

function unlock() {
  const pw = document.getElementById('pw-input').value;
  const stored = getStoredHash();

  if (!stored) {
    // First time: set the password
    if (pw.length < 4) {
      document.getElementById('lock-error').textContent = 'Choose a password of at least 4 characters.';
      return;
    }
    setPassword(pw);
    sessionStorage.setItem(SESSION_KEY, '1');
    showApp();
    return;
  }

  if (hashString(pw) === stored) {
    sessionStorage.setItem(SESSION_KEY, '1');
    showApp();
  } else {
    document.getElementById('lock-error').textContent = 'Incorrect password.';
    document.getElementById('pw-input').value = '';
    document.getElementById('pw-input').focus();
  }
}

function signOut() {
  sessionStorage.removeItem(SESSION_KEY);
  document.getElementById('app').style.display = 'none';
  document.getElementById('lock-screen').style.display = 'flex';
  document.getElementById('pw-input').value = '';
  document.getElementById('lock-error').textContent = '';
}

function showApp() {
  document.getElementById('lock-screen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  init();
}

// Check session on load
if (sessionStorage.getItem(SESSION_KEY) === '1' && getStoredHash()) {
  showApp();
} else {
  // Update placeholder based on whether password is set
  if (!getStoredHash()) {
    document.querySelector('.lock-title').textContent = 'Set your password';
    document.getElementById('pw-input').placeholder = 'Choose a password';
  }
}

// ── App logic ─────────────────────────────────────────────────
const STORAGE_KEY = 'debrief_sessions_v1';
let sessions = [];
let activeId = null;

function init() {
  sessions = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
  renderSidebar();
  if (sessions.length) loadSession(sessions[sessions.length - 1].id);
  else showNew();
}

function saveSessions() { localStorage.setItem(STORAGE_KEY, JSON.stringify(sessions)); }

function renderSidebar() {
  const list = document.getElementById('session-list');
  if (!list) return;
  if (!sessions.length) {
    list.innerHTML = '<div class="sidebar-empty">No sessions yet</div>';
    return;
  }
  list.innerHTML = sessions.slice().reverse().map(s => {
    const avg = s.results ? avgScore(s.results.answers) : null;
    return `<div class="session-item ${s.id === activeId ? 'active' : ''}" onclick="loadSession('${s.id}')">
      <span class="session-company">${s.company}</span>
      <span class="session-meta">${s.role} · ${s.date}</span>
      ${avg ? `<span class="session-score">${avg.toFixed(1)} / 5</span>` : ''}
    </div>`;
  }).join('');
}

function avgScore(answers) {
  if (!answers || !answers.length) return 0;
  return answers.reduce((s, a) => s + (a.score || 0), 0) / answers.length;
}

function showNew() {
  activeId = null;
  renderSidebar();
  document.getElementById('main-panel').innerHTML = `
  <div class="page-header">
    <div class="page-eyebrow">New session</div>
    <div class="page-title">Debrief your interview</div>
    <div class="page-sub">Paste your transcript. The agent scores every answer and tells you what to fix.</div>
  </div>
  <div class="panel">
    <div class="panel-title">Session details</div>
    <div class="form-row">
      <div class="form-group">
        <label for="inp-company">Company</label>
        <input id="inp-company" type="text" placeholder="e.g. Cresta" />
      </div>
      <div class="form-group">
        <label for="inp-role">Role</label>
        <input id="inp-role" type="text" placeholder="e.g. AI Success Manager" />
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label for="inp-round">Round</label>
        <select id="inp-round">
          <option>Recruiter screen</option>
          <option>Hiring manager</option>
          <option>Technical</option>
          <option>Case / presentation</option>
          <option>Final / panel</option>
        </select>
      </div>
      <div class="form-group">
        <label for="inp-date">Date</label>
        <input id="inp-date" type="date" value="${new Date().toISOString().slice(0,10)}" />
      </div>
    </div>
    <div class="form-group full" style="margin-top:4px">
      <label for="inp-jd">Role requirements (optional)</label>
      <textarea id="inp-jd" rows="3" placeholder="Paste key job description bullets to anchor the scoring..."></textarea>
    </div>
    <div class="form-group full" style="margin-top:4px">
      <label for="inp-transcript">Interview transcript</label>
      <textarea id="inp-transcript" rows="13" placeholder="Paste your full interview transcript here — include both questions and your answers. Rough notes work too."></textarea>
      <div class="char-hint">Tip: even rough notes work. Just capture what was asked and what you said.</div>
    </div>
    <button class="run-btn" id="run-btn" onclick="runDebrief()">
      <div class="spinner"></div>
      <span class="btn-label">Run debrief</span>
    </button>
  </div>`;
}

function loadSession(id) {
  const s = sessions.find(s => s.id === id);
  if (!s) return;
  activeId = id;
  renderSidebar();
  if (s.results) renderResults(s);
}

async function runDebrief() {
  const company    = document.getElementById('inp-company').value.trim();
  const role       = document.getElementById('inp-role').value.trim();
  const round      = document.getElementById('inp-round').value;
  const date       = document.getElementById('inp-date').value;
  const jd         = document.getElementById('inp-jd').value.trim();
  const transcript = document.getElementById('inp-transcript').value.trim();
  if (!company || !transcript) { alert('Please fill in company and transcript.'); return; }

  const btn = document.getElementById('run-btn');
  btn.classList.add('loading');
  btn.disabled = true;

  const id = Date.now().toString();
  try {
    const results = await callClaude(company, role, round, jd, transcript);
    const session = { id, company, role, round, date, jd, transcript, results };
    sessions.push(session);
    activeId = id;
    saveSessions();
    renderSidebar();
    renderResults(session);
  } catch (e) {
    btn.classList.remove('loading');
    btn.disabled = false;
    const errDiv = document.createElement('div');
    errDiv.className = 'error-box';
    errDiv.textContent = 'Error: ' + e.message;
    btn.parentNode.insertBefore(errDiv, btn);
  }
}

async function callClaude(company, role, round, jd, transcript) {
  const sys = `You are an expert interview coach. Analyze the transcript and return raw JSON only — no markdown, no backticks.

JSON structure:
{
  "answers": [
    {
      "question": "the interviewer's question",
      "answer_summary": "2-sentence summary of what the candidate said",
      "score": <integer 1-5>,
      "score_rationale": "one sentence explaining the score",
      "what_worked": "specific thing that landed well (1-2 sentences)",
      "what_was_missing": "specific gap or weakness (1-2 sentences)",
      "rewrite": "a stronger version using the same facts, better structure (3-5 sentences)"
    }
  ],
  "pattern_note": "one recurring pattern across all answers — a habit or tendency (2-3 sentences)",
  "fix_before_next_round": "the single most important concrete action to take before the next round (2-3 sentences)"
}

Scoring: 5=excellent specific outcome-focused, 4=good minor gaps, 3=average but vague, 2=weak no outcomes, 1=poor. Be honest. Do not invent facts in rewrites.`;

  const user = `Company: ${company}\nRole: ${role}\nRound: ${round}\n${jd ? 'Requirements:\n' + jd + '\n' : ''}\nTranscript:\n${transcript}`;

  const res = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      model: 'claude-sonnet-4-20250514',
      max_tokens: 4000,
      system: sys,
      messages: [{ role: 'user', content: user }]
    })
  });

  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw new Error(err.error?.message || `API error ${res.status}`);
  }
  const data = await res.json();
  const text = data.content.find(b => b.type === 'text')?.text || '';
  return JSON.parse(text.replace(/```json|```/g, '').trim());
}

function renderResults(session) {
  const r = session.results;
  const avg = avgScore(r.answers);
  const weakIdx = r.answers.reduce((wi, a, i, arr) => a.score < arr[wi].score ? i : wi, 0);

  const answersHtml = r.answers.map((a, i) => `
    <div class="qa-card ${i === weakIdx ? 'weak' : ''}" id="qa-${i}">
      <div class="qa-header" onclick="toggleCard(${i})">
        <div class="qa-question">${esc(a.question)}</div>
        <div class="qa-score-row">
          <span class="qa-num ${a.score <= 2 ? 'low' : ''}">${a.score}</span>
          <span class="qa-chevron">▾</span>
        </div>
      </div>
      <div class="qa-body">
        <div class="qa-section">
          <div class="qa-section-label">Your answer</div>
          <div class="qa-text">${esc(a.answer_summary)}</div>
          <div class="qa-rationale">${esc(a.score_rationale)}</div>
        </div>
        <div class="qa-section">
          <div class="qa-section-label">What worked</div>
          <div class="qa-text">${esc(a.what_worked)}</div>
        </div>
        <div class="qa-section">
          <div class="qa-section-label">What was missing</div>
          <div class="qa-text">${esc(a.what_was_missing)}</div>
        </div>
        <div class="qa-section">
          <div class="qa-section-label">Stronger version</div>
          <div class="qa-rewrite">${esc(a.rewrite)}</div>
        </div>
      </div>
    </div>`).join('');

  document.getElementById('main-panel').innerHTML = `
  <div class="page-header">
    <div class="page-eyebrow">${esc(session.round)}</div>
    <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px">
      <div class="page-title">${esc(session.company)} · ${esc(session.role)}</div>
      <span class="score-badge">${avg.toFixed(1)} / 5</span>
    </div>
    <div class="page-sub">${esc(session.date)} · ${r.answers.length} questions scored</div>
  </div>
  <div class="insight-box">
    <div class="insight-label">Pattern note</div>
    <div class="insight-text">${esc(r.pattern_note)}</div>
  </div>
  <div class="insight-box fix">
    <div class="insight-label">Fix before next round</div>
    <div class="insight-text">${esc(r.fix_before_next_round)}</div>
  </div>
  <hr class="divider">
  <div class="panel-title" style="margin-bottom:12px">Answer breakdown</div>
  ${answersHtml}`;

  setTimeout(() => toggleCard(weakIdx, true), 80);
}

function toggleCard(i, forceOpen) {
  const card = document.getElementById('qa-' + i);
  if (!card) return;
  if (forceOpen) { card.classList.add('open'); return; }
  card.classList.toggle('open');
}

function esc(s) {
  return (s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
</script>
</body>
</html>
